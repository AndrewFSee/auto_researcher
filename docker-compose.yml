# Auto Researcher
#
#   docker compose up --build        # dashboard on http://localhost:8501
#   docker compose run --rm app python scripts/ml_walkforward_backtest.py --offline
#
# The project stores everything in local files under ./data (price cache,
# news SQLite DB, vector stores, ranking results); no database server or
# cache service is needed.

services:
  app:
    build:
      context: .
      args:
        EXTRAS: dashboard,llm
    image: auto-researcher:latest
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./docs/results:/app/docs/results
    restart: unless-stopped
