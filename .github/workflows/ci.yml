name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      # Correctness rules only (see [tool.ruff.lint] in pyproject.toml).
      - run: ruff check src tests scripts app.py --output-format=github

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package (core + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Tests that need optional heavy dependencies (torch, chromadb, optuna,
      # litellm, ...) skip themselves when those packages are absent.
      - name: Run tests
        run: pytest -q --cov=auto_researcher --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  typecheck:
    name: Type check (new evaluation core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The evaluation core is kept type-clean; the legacy modules are not yet.
      - run: >
          mypy --ignore-missing-imports --follow-imports=silent
          src/auto_researcher/validation/splits.py
          src/auto_researcher/validation/event_dates.py
          src/auto_researcher/backtest/walk_forward.py
          src/auto_researcher/features/alpha_factors.py
          src/auto_researcher/features/earnings_events.py
          src/auto_researcher/features/news_signals.py
          src/auto_researcher/backtest/event_strategy.py
          src/auto_researcher/backtest/baselines.py
          src/auto_researcher/composite.py
          src/auto_researcher/screening.py
          src/auto_researcher/data/fmp_earnings.py
          src/auto_researcher/data/alphavantage_earnings.py
          src/auto_researcher/data/sec_fundamentals.py
          src/auto_researcher/features/valuation.py
          src/auto_researcher/features/fundamental_factors.py
          src/auto_researcher/models/growth_forecast.py

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
