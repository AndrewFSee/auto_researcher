[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-researcher"
version = "0.2.0"
description = "Equity research platform: point-in-time signal pipelines, leakage-safe evaluation tools, and analyst tooling"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Auto Researcher Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Everything imported unconditionally by the core package (features, models,
# backtest, validation, screening, data loaders).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "yfinance>=0.2.40",
    "pyarrow>=14",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Transformer / embedding models, vector stores, topic models
nlp = [
    "torch>=2.1",
    "transformers>=4.36",
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "bertopic>=0.16",
    "nltk>=3.8",
    "beautifulsoup4>=4.12",
]
# LLM-backed agents (review, debate, deep research)
llm = [
    "litellm>=1.30",
    "openai>=1.0",
    "gpt-researcher>=0.8",
]
# Public alternative-data adapters
altdata = [
    "pytrends>=4.9",
    "praw>=7.7",
]
# Hyperparameter search
tuning = [
    "optuna>=3.4",
]
# SEC EDGAR fundamentals
finagg = [
    "finagg>=0.4.0",
]
# Streamlit dashboard
dashboard = [
    "streamlit>=1.50",
]
# Extras used only by research scripts
research = [
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "joblib>=1.3",
    "aiohttp>=3.9",
    "pandera>=0.17",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-requests",
]
all = [
    "auto-researcher[nlp,llm,altdata,tuning,finagg,dashboard,research,dev]",
]

[project.scripts]
auto-researcher = "auto_researcher.cli.main:main"
auto-researcher-screen = "auto_researcher.screening:main"

[tool.setuptools.packages.find]
where = ["src"]

# =============================================================================
# Testing
# =============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: needs optional heavy dependencies, model downloads or network",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/auto_researcher"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

# =============================================================================
# Linting & formatting (ruff replaces black + isort)
# =============================================================================

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"
extend-exclude = ["*.egg-info"]

[tool.ruff.lint]
# CI enforces correctness rules. Style rules (E/W/I/UP/SIM) are available via
# `ruff check --select ALL`-style runs, but the legacy code base has not been
# reformatted yet; do that in a dedicated formatting-only change.
select = [
    "F",      # Pyflakes: undefined names, unused imports/variables, ...
    "E9",     # syntax / IO errors
    "B",      # flake8-bugbear: likely bugs
]
ignore = [
    "B007",   # unused loop variable (style)
    "B008",   # function calls in defaults (dataclass field factories)
    "B905",   # zip() without strict= (legacy code)
    "B904",   # raise without from (legacy code)
    "F401",   # unused imports (legacy code; re-exports)
    "F541",   # f-string without placeholders (cosmetic)
    "F841",   # unused local (legacy code)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]   # scripts bootstrap sys.path before importing the package
"tests/*" = ["B011", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
